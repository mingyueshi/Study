<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="乐学堂 · 成语本：按主题学习成语，拼音、逐字点读、典故故事、例句与近反义词，全部可点读。">
  <title>成语本 · 乐学堂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏮%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="words.css">
  <link rel="stylesheet" href="idioms.css">
</head>
<body>
  <div id="app">
    <header>
      <button class="logo" data-act="home">🏮 成语本</button>
      <span class="stats-pill" id="stats"></span>
      <span class="spacer"></span>
      <button class="back-btn" data-act="words">📘 单词本</button>
      <button class="back-btn" data-act="writing">✏️ 作文坊</button>
      <button class="back-btn" data-act="home">⬅ 返回乐学堂</button>
    </header>

    <nav id="chips" aria-label="分类切换"></nav>

    <section class="toolbar">
      <div class="search-box">
        <span>🔎</span>
        <input id="search" type="search" placeholder="搜索成语、拼音、释义或故事…" autocomplete="off">
      </div>
      <button class="play-btn" id="playBtn" data-act="play">▶️ 连读本单元</button>
    </section>

    <main id="cards"></main>
  </div>

  <script src="speech.js"></script>
  <script src="idioms-data.js"></script>
  <script src="idioms-app.js"></script>
</body>
</html>
