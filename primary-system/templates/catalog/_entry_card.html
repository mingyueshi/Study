{% load static %}{% if card.links %}<div class="module-card color-{{ card.color_code }}"><img src="{% static 'icons/' %}{{ card.icon }}.svg" alt="" width="88" height="88"><span class="module-meta">{{ card.subject_label }} <span aria-hidden="true">↗</span></span><h3>{{ card.name }}</h3><p>{{ card.blurb }}</p><span class="tag">{{ card.badge }}</span><div class="module-card-links">{% for link in card.links %}<a class="button small" href="{{ link.url }}">{{ link.name }} <span aria-hidden="true">→</span></a>{% endfor %}</div></div>{% else %}<a class="module-card color-{{ card.color_code }}" href="{{ card.url }}"><img src="{% static 'icons/' %}{{ card.icon }}.svg" alt="" width="88" height="88"><span class="module-meta">{{ card.subject_label }} <span aria-hidden="true">↗</span></span><h3>{{ card.name }}</h3><p>{{ card.blurb }}</p><span class="tag">{{ card.badge }}</span></a>{% endif %}
