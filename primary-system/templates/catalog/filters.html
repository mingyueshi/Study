<div class="filter-chips">
  {% for row in filter_rows %}
  <div class="filter-chips-row">
    <span class="filter-chips-label">{{ row.label }}</span>
    {% for chip in row.chips %}<a class="filter-chip{% if chip.on %} on{% endif %}" href="{{ chip.url }}">{{ chip.label }}</a>{% endfor %}
  </div>
  {% endfor %}
  <form class="filter-search" method="get">
    {% for key, value in search_hidden %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
    <input type="search" name="q" value="{{ q_value }}" placeholder="搜索学习册或知识点" aria-label="搜索学习册或知识点">
    <button class="button small" type="submit">查找</button>
  </form>
</div>
