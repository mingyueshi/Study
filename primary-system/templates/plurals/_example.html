<div class="plural-example" data-plural-example="{{ form }}">
  <div class="plural-example-heading">
    <span>{{ label }}</span>
    <button class="say-chip" type="button" data-say="{{ example.en }}" aria-label="听{{ label }}整句"><span aria-hidden="true">🔊</span> 听整句</button>
  </div>
  <p class="plural-example-en" lang="en">{{ example.en }}</p>
  <p class="plural-example-cn" lang="zh-CN">{{ example.cn }}</p>
</div>
