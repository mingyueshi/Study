<svg viewBox="0 0 640 410" role="img" aria-labelledby="breathing-title breathing-desc">

    <marker id="gas-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 10 5 0 10" fill="#b34845"/></marker>
  </defs>
  <path class="body-anatomy-outline" d="M197 20v35l-62 29c-34 24-42 96-43 176l18 111h250l18-111c-1-80-9-152-43-176l-62-29V20"/>
  <path d="M236 48v100m0-18-41 41m41-41 41 41" fill="none" stroke="#e1be83" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M214 126c-27-15-46 12-62 51-19 44-33 101-16 123 13 17 59 6 76-11 16-16 16-145 2-163Z" fill="#82cdb7" stroke="#286d5c" stroke-width="3"/>

  <path data-breath-in d="M236 66v61" fill="none" stroke="#246a5c" stroke-width="5" marker-end="url(#breath-arrow)"/>
  <path data-breath-out d="M236 127V66" fill="none" stroke="#246a5c" stroke-width="5" marker-end="url(#breath-arrow)"/>
  <g class="body-svg-labels">
    <path d="M43 77h113l58 20M42 223h82M50 369h80l35-28" class="body-leader"/>
    <text x="38" y="66">{{ diagram.labels.airway }}</text>
    <text x="44" y="212">{{ diagram.labels.lungs }}</text>

  </g>
  <path d="M322 227 409 172" stroke="#85a893" stroke-width="2" stroke-dasharray="5 6"/>

    <rect x="403" y="59" width="222" height="316" rx="24" fill="#fffdf2" stroke="#bad4c1" stroke-width="2"/>
    <text x="514" y="94" text-anchor="middle" class="body-svg-label">{{ diagram.labels.alveoli }}</text>
    <path d="M474 135v21c-27 14-37 36-33 62 3 28 26 48 53 49 28 1 53-19 57-48 4-27-9-48-36-63v-21" fill="#d7e9a1" stroke="#79944a" stroke-width="3"/>

      <text x="484" y="297">{{ diagram.labels.air }}</text>
      <text x="514" y="326" fill="#a7433f">{{ diagram.labels.oxygen }}</text>
      <text x="514" y="351">{{ diagram.labels.carbon }}</text>
    </g>
  </g>
