{% if teaching %}<section class="dictionary-teaching" aria-labelledby="teaching-title"><div class="section-heading"><div><p class="eyebrow">回到熟悉的课本里</p><h2 id="teaching-title">相关教学卡片</h2><p>按字词查找的现有讲解；不表示与上方每个词典义项一一对应。</p></div></div><div class="book-grid">{% for item in teaching %}<a class="book-card" href="{% url 'item' item.pk %}"><span class="tag">{{ item.module.name }}</span><h3>{{ item.title }}</h3><p>{{ item.summary|truncatechars:100 }}</p><span class="book-action">阅读教学讲解 <span aria-hidden="true">→</span></span></a>{% endfor %}</div></section>{% endif %}
