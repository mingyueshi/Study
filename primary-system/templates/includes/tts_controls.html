{% load static %}
<link rel="stylesheet" href="{% static 'tts.css' %}?v=3">
<fieldset class="tts-settings" aria-describedby="tts-status">
  <legend>朗读设置</legend>
  <div class="tts-controls-grid">
    <label class="tts-voice-control" for="tts-voice">英语发音
      <select id="tts-voice"><option value="">正在加载发音人……</option></select>
    </label>
    <div class="tts-control-slider">
      <label for="tts-rate">速度 <output id="tts-rate-value" for="tts-rate">0.80×</output></label>
      <input id="tts-rate" type="range" min="0.5" max="1.5" step="0.05" value="0.8">
    </div>
    <div class="tts-control-slider">
      <label for="tts-volume">音量 <output id="tts-volume-value" for="tts-volume">100%</output></label>
      <input id="tts-volume" type="range" min="0" max="1" step="0.05" value="1">
    </div>
    <button class="button small" id="tts-preview" type="button" data-say="Hello! Nice to meet you.">试听</button>
  </div>
  <p id="tts-status" class="tts-controls-note">与场景单词、教材同步单词共用设置，保存在当前浏览器；调整后从下一次发音生效。</p>
</fieldset>
