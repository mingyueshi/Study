{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'study_topics/reading.css' %}?v=37b1aaceb767">
<link rel="stylesheet" href="{% static 'classical/classical.css' %}?v=056a0b75341e">
{% block classical_assets %}{% endblock %}
<div class="classical-hall" {% block classical_attributes %}{% endblock %}>
  {% block classical_hero %}{% endblock %}
  <div class="cw-workspace study-reading-layout" data-sidebar-layout=".cw-sidebar" data-sidebar-width="clamp(255px, 24vw, 340px)" data-sidebar-label="阅读侧栏">
    <aside class="cw-sidebar study-reading-sidebar" aria-label="古文精读馆目录和导航">
      {% block classical_sidebar %}{% endblock %}
      {% include 'classical/_nav.html' %}
    </aside>
    <div class="cw-main study-reading-main">
      {% block classical_main %}{% endblock %}
    </div>
  </div>
</div>
<script src="{% static 'classical/classical.js' %}?v=792a56085416" defer></script>
{% endblock %}
