<section class="morph-intro" aria-label="认识词根词缀">

  <ol>{% for step in morphology_data.steps %}<li>{{ step }}</li>{% endfor %}</ol>
  <div class="morph-legend" aria-label="拆词颜色说明"><span class="morph-part-prefix">前缀</span><span class="morph-part-base">完整词基</span><span class="morph-part-root">词根</span><span class="morph-part-suffix">后缀</span><span class="morph-part-component">其他组成部分</span></div>
  <p class="morph-intro-note">{{ morphology_data.limits.0 }}</p>
</section>
