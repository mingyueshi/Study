{% load static %}
<figure class="origins-figure">
  <img src="{% static figure.path %}" alt="{{ figure.alt }}" {% if lazy %}loading="lazy"{% endif %}>
  {% if station.slug == 'migration' %}
  <ul class="origins-map-key" aria-label="迁徙图例">
    <li><span class="origins-route-early" aria-hidden="true"></span>直立人等早期人类的扩散</li>
    <li><span class="origins-route-later" aria-hidden="true"></span>后来智人的迁徙</li>
  </ul>
  {% endif %}
  <figcaption>{{ figure.caption }} <a href="#source-{{ figure.source }}">{{ figure.credit }} ↘</a></figcaption>
</figure>
