<section><h2>来源笔顺图</h2><p>Make Me a Hanzi 固定字形；存在字形区域差异，不代表所有教材写法。来源拼音：{{ asset.pinyin|join:'、' }}；部件：{{ asset.decomposition }}。</p><svg id="stroke-board" viewBox="0 -124 1024 1024" role="img" aria-label="{{ asset.character }}笔顺图" style="width:min(100%,360px);height:auto;background:#fff;border:1px solid #ccd"><g transform="translate(0,776) scale(1,-1)">{% for path in asset.strokes %}<path d="{{ path }}" fill="#b8c4c3" data-stroke="{{ forloop.counter }}"/>{% endfor %}</g></svg><p id="stroke-status" role="status">显示全部 {{ asset.strokes|length }} 笔</p><button type="button" class="button small" id="stroke-next">逐笔显示</button> <button type="button" class="button secondary small" id="stroke-reset">重新开始</button><script>(()=>{const paths=[...document.querySelectorAll('[data-stroke]')],status=document.getElementById('stroke-status');let count=0;const paint=()=>{paths.forEach((p,i)=>p.setAttribute('fill',i<count?'#1c6250':'#e1e9e7'));status.textContent=`第 ${count} / ${paths.length} 笔`;};document.getElementById('stroke-next').addEventListener('click',()=>{count=count>=paths.length?1:count+1;paint();});document.getElementById('stroke-reset').addEventListener('click',()=>{count=0;paint();});})();</script></section>
<details class="dictionary-evidence"><summary>笔顺来源与版本</summary><p>Make Me a Hanzi · {{ asset.version }}</p></details>
