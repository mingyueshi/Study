<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洋流 · 海洋世界</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../map-skills/experiment.css">
  <script src="../geo-map/world-geo.js" defer></script>
  <script src="ocean-data.js" defer></script>
  <script src="ocean-model.js" defer></script>
  <script src="../earth/earth-motion.js" defer></script>
  <script src="ocean-app.js" defer></script>
  <script src="../map-skills/experiment.js" defer></script>
</head>
<body>
  <main id="main" class="ocean-topic geo-experiment" data-ocean-page="currents">
    <header class="ocean-hero experiment-heading">
      <h1>洋流</h1>
      <p id="ocean-intro"></p>
    </header>
    <div class="experiment-workspace" data-sidebar-layout=".experiment-side"
         data-sidebar-width="clamp(260px, 24vw, 320px)" data-sidebar-label="实验工具"
         data-sidebar-collapse-key="primary_sidebar_collapsed_v1:.ocean-sidebar">
      <aside class="experiment-side" aria-label="实验参数与海洋世界目录">
        <details class="experiment-tools" id="experiment-tools" open>
          <summary>选择洋流</summary>
          <div class="experiment-controls">
            <div class="ocean-choices" id="current-choices" role="group" aria-label="选择洋流"></div>
            <a class="experiment-return" href="#ocean-lab" data-experiment-return>返回实验 ↓</a>
          </div>
        </details>
        <details class="experiment-tools">
          <summary>海洋世界与相关专题</summary>
          <nav class="experiment-links" aria-label="海洋世界各站">
            <a href="index.html">海洋总览</a>
            <a href="currents.html" aria-current="page">洋流</a>
            <a href="tides.html">潮汐</a>
            <a href="life.html">海洋生物</a>
            <a href="seafloor.html">海底地形</a>
            <a href="../geo-map/world.html">打开世界地图</a>
          </nav>
        </details>
      </aside>

      <div class="ocean-content experiment-content">
        <section class="ocean-panel" id="ocean-lab" tabindex="-1" aria-labelledby="current-heading">
          <div class="experiment-panel-head">
            <h2 id="current-heading">沿着箭头追洋流</h2>
            <a class="experiment-jump" href="#experiment-tools" data-experiment-jump>实验参数 ↑</a>
          </div>
          <figure>
            <canvas id="ocean-map" role="img" aria-label="洋流教学地图，箭头指向下游。可点击路径或用侧栏按钮选择。"></canvas>
            <figcaption class="ocean-legend">
              <span class="ocean-swatch warm">暖流</span><span class="ocean-swatch cold">寒流</span><span class="ocean-swatch circumpolar">南极绕极流</span>
              <span>路线为代表性示意，实际位置和强度会变化。可点路径定位。</span>
            </figcaption>
          </figure>
          <div class="ocean-choices" role="group" aria-label="洋流播放控制">
            <button type="button" data-play aria-pressed="false">播放示意</button>
            <button type="button" data-step>前进一格</button>
            <button type="button" data-reset>回到洋流起点</button>
          </div>
          <label class="ocean-range" for="current-position"><span>沿当前洋流移动 <output id="current-position-value" aria-live="off"></output></span>
            <input id="current-position" type="range" min="0" max="100" value="0" step="1" data-progress>
          </label>
          <p class="ocean-note" data-motion-status role="status"></p>
          <article class="ocean-result" id="current-result" aria-live="polite"></article>
        </section>
        <div class="ocean-grid" id="ocean-knowledge" aria-label="概念与证据"></div>
        <details class="ocean-panel ocean-details"><summary id="ocean-question">想一想</summary><p id="ocean-answer"></p></details>
        <details class="ocean-panel ocean-details"><summary>资料和图片出处</summary><ul id="ocean-references"></ul></details>
        <noscript><p>请启用 JavaScript 查看专题正文和交互图。</p></noscript>
      </div>
    </div>
  </main>
</body>
</html>
