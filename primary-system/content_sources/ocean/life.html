<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海洋生物 · 海洋世界</title>
  <link rel="stylesheet" href="styles.css">
  <script src="ocean-data.js" defer></script>
  <script src="ocean-model.js" defer></script>
  <script src="ocean-app.js" defer></script>
</head>
<body>
  <main id="main" class="ocean-topic" data-ocean-page="life"
        data-sidebar-layout=".ocean-sidebar" data-sidebar-width="clamp(240px, 22vw, 300px)"
        data-sidebar-breakpoint="900" data-sidebar-label="专题目录" data-sidebar-fixed=".ocean-nav">
    <aside class="ocean-sidebar" aria-label="海洋世界专题目录">
      <nav class="ocean-nav" aria-label="海洋世界各站">
        <strong>海洋世界</strong>
          <a href="index.html">海洋总览</a>
          <a href="currents.html">洋流</a>
          <a href="tides.html">潮汐</a>
          <a href="life.html" aria-current="page">海洋生物</a>
          <a href="seafloor.html">海底地形</a>
      </nav>
      <a class="ocean-map-link" href="../atlas/world.html">返回世界地图 ↗</a>
    </aside>
    <div class="ocean-content">
      <header class="ocean-hero">
        <h1>海洋生物</h1>
        <p id="ocean-intro"></p>
      </header>
      <section class="ocean-panel" aria-labelledby="dive-heading">
        <h2 id="dive-heading">下潜观察海洋生物</h2>
        <div class="ocean-choices" id="depth-choices" role="group" aria-label="选择水层"></div>
        <label class="ocean-range" for="dive-depth"><span>水深 <output id="dive-depth-value"></output></span>
          <input id="dive-depth" type="range" min="0" max="11000" step="10" value="30">
        </label>
        <div id="depth-bar" class="ocean-depth-bar" aria-hidden="true"><span></span></div>
        <p class="ocean-pressure">估算总压力 <output id="dive-pressure" for="dive-depth"></output> 个大气压</p>
        <p class="ocean-note">估算从海面 1 个大气压起，每下潜 10 米增加约 1 个大气压。水层边界是教学约数，透光深度会随水体清澈程度而变。这里合并显示约 1000—6000 米的深水层，更深处主要见于海沟。照片深度与滑块读数无关。</p>
        <article class="ocean-result ocean-observation" id="life-result" aria-live="polite"></article>
      </section>
      <section class="ocean-panel ocean-observation" id="ocean-vent" aria-label="热液喷口生态"></section>
      <a class="ocean-link-card" href="../geo-map/world-animals.html">去世界动物地图找更多海洋动物 →</a>
      <div class="ocean-grid" id="ocean-knowledge" aria-label="概念与证据"></div>
      <details class="ocean-panel ocean-details"><summary id="ocean-question">想一想</summary><p id="ocean-answer"></p></details>
      <details class="ocean-panel ocean-details"><summary>资料和图片出处</summary><ul id="ocean-references"></ul></details>
      <noscript><p>请启用 JavaScript 查看专题正文和交互图。</p></noscript>
    </div>
  </main>
</body>
</html>
