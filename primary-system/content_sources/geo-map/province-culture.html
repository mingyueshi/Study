<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="中国省份文化：在地图上认识34个省级行政区的简称、省会或行政中心、特产、民俗与代表景观。">
  <title>中国省份文化 · 乐学堂</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="province-culture.css">
  <script src="china-geo.js" defer></script>
  <script src="content.js" defer></script>
  <script src="map-data.js" defer></script>
  <script src="map-discovery-data.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="province-culture-data.js" defer></script>
  <script src="province-culture.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <main id="main" class="gm-topic culture-topic" tabindex="-1">
    <aside class="gm-sidebar" aria-label="省份文化导航与筛选">
      <nav class="gm-sysnav" aria-label="关联地图">
        <a data-page href="china.html">中国地图 ↗</a>
        <a data-page href="province.html">省域站 ↗</a>
      </nav>
      <header class="gm-hero">
        <p class="gm-eyebrow">从家乡出发 · 34 个省级行政区</p>
        <h1 class="gm-title">中国省份文化</h1>
        <p class="gm-intro" id="culture-intro"></p>
      </header>
      <section class="gm-side-panel culture-filters" aria-label="筛选省级行政区">
        <label for="culture-search">找省名、简称、城市或文化</label>
        <input id="culture-search" type="search" placeholder="试试「蜀」「南宁」「风筝」…" autocomplete="off">
        <div id="culture-types" class="culture-chips" role="group" aria-label="行政区类型"></div>
        <button type="button" id="culture-clear">清空筛选</button>
        <p id="culture-result" role="status"></p>
        <div id="culture-picker" class="culture-picker" role="group" aria-label="直接选择省级行政区"></div>
      </section>
    </aside>
    <div id="content" class="gm-content" tabindex="-1">
      <header class="culture-compact-heading"><div><h1>中国省份文化</h1><p>在地图上走访 34 个省级行政区</p></div><button type="button" id="culture-open-picker">按省名选择</button></header>
      <p id="culture-notice" class="gm-notice" role="status" hidden></p>
      <div class="culture-workspace">
        <section class="culture-map-panel" aria-labelledby="culture-map-title">
          <div class="culture-map-heading"><h2 id="culture-map-title">在地图上认识家乡</h2><span id="culture-map-selected"></span></div>
          <figure>
            <svg id="culture-map" role="group" aria-label="点击省份，查看文化档案"></svg>
            <figcaption>橙色为选中的省级行政区；圆点是省会或行政区中心的参考位置。小面积地区也可从省名按钮选择。边界为学习示意，南海诸岛见右下小图。</figcaption>
          </figure>
        </section>
        <article id="culture-profile" class="culture-profile" tabindex="-1" aria-label="当前省份文化档案"></article>
      </div>
      <details class="culture-scope"><summary>怎样使用这份文化地图？</summary><p id="culture-scope-note"></p><p id="culture-capital-note"></p></details>
      <noscript><p class="gm-notice">请启用 JavaScript，选择省份并查看文化档案。</p></noscript>
    </div>
  </main>
</body>
</html>
