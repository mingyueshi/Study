<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界动物地图 · 地理图谱</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="animals.css">
  <script src="world-geo.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="world-animals-data.js" defer></script>
  <script src="animals-app.js" defer></script>
</head>
<body>
  <main id="main" class="gm-wildlife" data-map="world" tabindex="-1">
    <header class="gm-wildlife-header">
      <div>
        <p class="gm-wildlife-kicker">地理图谱 <span aria-hidden="true">／</span> 野外观察</p>
        <h1>世界动物地图</h1>
        <p>从北极的冰海到非洲的草原，点一点地图，看看七大洲和大洋里的动物怎样生活。</p>
      </div>
      <nav class="gm-wildlife-links" aria-label="地图切换">
        <a href="index.html">图谱首页</a>
        <a href="world-plants.html">世界植物地图</a>
        <a href="world.html">← 返回世界地图</a>
        <a href="animals.html">去看中国动物 →</a>
      </nav>
    </header>

    <div class="gm-wildlife-tools" hidden>
      <div>
        <h2 id="gm-habitat-title">按栖息地找</h2>
        <div class="gm-habitat-filters" role="group" aria-labelledby="gm-habitat-title"></div>
      </div>
    </div>

    <div class="gm-wildlife-workspace" hidden>
      <div class="gm-animal-explore">
        <figure class="gm-wildlife-map">
          <svg id="gm-animal-map" role="group" aria-label="世界野生动物代表栖息地示意地图"></svg>
          <figcaption><span id="gm-animal-count"></span>地图上的点表示代表地点，动物还可能在其他地方生活。</figcaption>
        </figure>
        <section class="gm-animal-catalog" aria-labelledby="gm-animal-choices-title">
          <div class="gm-animal-catalog-head">
            <div><h2 id="gm-animal-choices-title">选择动物</h2><p>点一张照片，看看它在地图上的家。</p></div>
            <a href="#gm-animal-map">回到地图 ↑</a>
          </div>
          <div id="gm-animal-picker" role="group" aria-labelledby="gm-animal-choices-title"></div>
        </section>
      </div>
      <article id="gm-animal-card" aria-labelledby="gm-animal-name"></article>
    </div>
    <noscript><p class="gm-notice">请启用 JavaScript 查看动物地图和照片。</p></noscript>
  </main>
</body>
</html>
