<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界植物地图 · 动植物地图</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="animals.css">
  <link rel="stylesheet" href="flat-map.css">
  <script src="world-geo.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="world-plants-data.js" defer></script>
  <script src="animals-learning.js" defer></script>
  <script src="animals-app.js" defer></script>
</head>
<body>
  <main id="main" class="gm-wildlife gm-map-topic gm-flora" data-life="plant" data-map="world" tabindex="-1">
    <header class="gm-flat-heading">
      <h1 class="gm-title">世界植物地图</h1>
      <p class="gm-intro">从美洲的巨杉到非洲的猴面包树，再到南极的小草，看看七大洲的植物怎样生长。</p>
      <a href="?plant=antarctic-hair-grass#gm-animal-card">南极发草照片与来源</a>
    </header>

    <div class="gm-wildlife-workspace gm-flat-workspace" data-sidebar-layout=".gm-sidebar" data-sidebar-width="clamp(280px, 24vw, 320px)" data-sidebar-label="地图工具" data-sidebar-collapse-key="primary_sidebar_collapsed_v1:#gm-animal-card" hidden>
      <aside class="gm-sidebar" aria-label="地图工具与相关专题">
        <details id="gm-wildlife-tools" class="gm-flat-tools gm-wildlife-tools" open tabindex="-1" hidden>
          <summary>筛选与定位</summary>
          <div class="gm-flat-controls">
            <div class="gm-animal-search-row">
              <label for="gm-animal-search">找植物<input id="gm-animal-search" type="search" placeholder="搜名称、学名、地点或环境" autocomplete="off"></label>
              <div class="inline-choice" data-inline-choice><label for="gm-animal-record-filter">观察记录<select id="gm-animal-record-filter"><option value="all">全部植物</option><option value="unseen">还没观察</option><option value="seen">已观察</option></select></label></div>
              <button type="button" data-animal-reset>清除筛选</button>
              <span id="gm-animal-search-status" role="status"></span>
            </div>
            <div>
              <h2 id="gm-habitat-title">按生长环境找</h2>
              <div class="gm-habitat-filters" role="group" aria-labelledby="gm-habitat-title"></div>
            </div>
          </div>
        </details>
        <details id="gm-life-explore" class="gm-flat-tools" tabindex="-1">
          <summary>观察与练习</summary>
          <div class="gm-flat-controls">
            <div class="gm-animal-progress-row" hidden>
              <label id="gm-animal-progress-label" for="gm-animal-progress">已观察 0／30 种</label>
              <progress id="gm-animal-progress" max="30" value="0"></progress>
              <small id="gm-animal-storage-note"></small>
              <button type="button" data-animal-random>认识新朋友</button>
            </div>
            <div class="gm-flat-choice gm-life-quiz-options">
              <div class="inline-choice" data-inline-choice><label for="gm-animal-quiz-mode">练习方式</label><select id="gm-animal-quiz-mode"><option value="photo">看照片认植物</option><option value="clue">读线索找植物</option></select></div>
              <button type="button" data-quiz-start>开始练习</button>
              <a href="#gm-animal-quiz">查看练习 ↓</a>
            </div>
          </div>
        </details>
        <details class="gm-flat-tools">
          <summary>相关专题</summary>
          <nav class="gm-flat-links" aria-label="动植物地图导航">
            <a href="life-maps.html">专题首页</a>
            <a href="animals.html">中国动物地图</a>
            <a href="plants.html">中国植物地图</a>
            <a href="world-animals.html">世界动物地图</a>
            <a href="world.html">世界地图</a>
          </nav>
        </details>
      </aside>

      <div id="content" class="gm-content gm-animal-explore" tabindex="-1">
        <figure class="gm-wildlife-map">
          <div class="gm-view-bar">
            <a href="#gm-animal-choices-title">物种图册 ↓</a>
            <a class="gm-tools-jump" href="#gm-wildlife-tools">地图工具 ↑</a>
          </div>
          <svg id="gm-animal-map" role="group" aria-label="世界植物代表分布地点示意地图"></svg>
          <figcaption><span id="gm-animal-count"></span>颜色表示生长环境，引线末端表示代表地点；并不是完整分布范围。</figcaption>
        </figure>
        <article id="gm-animal-card" aria-labelledby="gm-animal-name" tabindex="-1" hidden></article>
        <section id="gm-animal-quiz" class="gm-animal-quiz" aria-labelledby="gm-life-quiz-title" tabindex="-1" hidden>
          <div class="gm-quiz-inner">
            <div class="gm-life-quiz-head"><h2 id="gm-life-quiz-title">植物小侦探</h2><button type="button" data-quiz-stop>退出练习</button></div>
            <p class="gm-life-quiz-ready">从当前筛选中抽题，每轮最多 5 题。<a href="#gm-life-explore">选择方式，开始练习 ↑</a></p>
            <div id="gm-animal-quiz-body"></div>
          </div>
        </section>
        <section class="gm-animal-catalog" aria-labelledby="gm-animal-choices-title">
          <div class="gm-animal-catalog-head">
            <div><h2 id="gm-animal-choices-title">选择植物</h2><p>点一张照片，找分布、认叶花，看看它怎样适应环境。</p></div>
            <a href="#gm-animal-map">回到地图 ↑</a>
          </div>
          <p id="gm-animal-empty" hidden>暂时没有符合条件的植物。<button type="button" data-animal-reset>查看全部植物</button></p>
          <div id="gm-animal-picker" role="group" aria-labelledby="gm-animal-choices-title"></div>
        </section>
      </div>
    </div>
    <noscript><p class="gm-notice">请启用 JavaScript 查看植物地图和照片。</p></noscript>
  </main>
</body>
</html>
