<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界植物地图 · 地理图谱</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="animals.css">
  <script src="world-geo.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="world-plants-data.js" defer></script>
  <script src="animals-learning.js" defer></script>
  <script src="animals-app.js" defer></script>
</head>
<body>
  <main id="main" class="gm-wildlife gm-flora" data-life="plant" data-map="world" tabindex="-1">
    <header class="gm-wildlife-header">
      <div>
        <p class="gm-wildlife-kicker">地理图谱 <span aria-hidden="true">／</span> 野外观察</p>
        <h1>世界植物地图</h1>
        <p>从美洲的巨杉到非洲的猴面包树，再到南极的小草，看看七大洲的植物怎样生长。</p>
      </div>
      <nav class="gm-wildlife-links" aria-label="地图切换">
        <a href="index.html">图谱首页</a>
        <a href="world.html">← 返回世界地图</a>
        <a href="plants.html">去看中国植物 →</a>
      </nav>
    </header>

    <div class="gm-wildlife-tools" hidden>
      <div class="gm-animal-search-row">
        <label for="gm-animal-search">找植物<input id="gm-animal-search" type="search" placeholder="搜名称、学名、地点或环境" autocomplete="off"></label>
        <label for="gm-animal-record-filter">观察记录<select id="gm-animal-record-filter"><option value="all">全部植物</option><option value="unseen">还没观察</option><option value="seen">已观察</option></select></label>
        <button type="button" data-animal-reset>清除筛选</button>
        <span id="gm-animal-search-status" role="status"></span>
      </div>
      <div>
        <h2 id="gm-habitat-title">按生长环境找</h2>
        <div class="gm-habitat-filters" role="group" aria-labelledby="gm-habitat-title"></div>
      </div>
    </div>

    <div class="gm-animal-progress-row" hidden>
      <div><label id="gm-animal-progress-label" for="gm-animal-progress">已观察 0／30 种</label><progress id="gm-animal-progress" max="30" value="0"></progress><small id="gm-animal-storage-note"></small></div>
      <div><a href="#gm-animal-quiz">植物小侦探 ↓</a><button type="button" data-animal-random>认识新朋友 ↗</button></div>
    </div>

    <div class="gm-wildlife-workspace" data-sidebar-label="植物档案" hidden>
      <div class="gm-animal-explore">
        <figure class="gm-wildlife-map">
          <svg id="gm-animal-map" role="group" aria-label="世界植物代表分布地点示意地图"></svg>
          <figcaption><span id="gm-animal-count"></span>颜色表示生长环境，引线末端表示代表地点；并不是完整分布范围。</figcaption>
        </figure>
        <details id="gm-animal-quiz" class="gm-animal-quiz">
          <summary>植物小侦探 <span>看照片 · 读线索 · 每轮最多 5 题</span></summary>
          <div class="gm-quiz-inner">
            <p>从当前筛选中抽题，不重复。答完可以看地图、重练错题；练习不会自动标记「已观察」。</p>
            <div class="gm-quiz-toolbar"><label for="gm-animal-quiz-mode">练习方式</label><select id="gm-animal-quiz-mode"><option value="photo">看照片认植物</option><option value="clue">读线索找植物</option></select><button type="button" data-quiz-start>开始练习</button><button type="button" data-quiz-stop hidden>结束本轮</button></div>
            <div id="gm-animal-quiz-body"></div>
          </div>
        </details>
        <section class="gm-animal-catalog" aria-labelledby="gm-animal-choices-title">
          <div class="gm-animal-catalog-head">
            <div><h2 id="gm-animal-choices-title">选择植物</h2><p>点一张照片，找分布、认叶花，看看它怎样适应环境。</p></div>
            <a href="#gm-animal-map">回到地图 ↑</a>
          </div>
          <p id="gm-animal-empty" hidden>暂时没有符合条件的植物。<button type="button" data-animal-reset>查看全部植物</button></p>
          <div id="gm-animal-picker" role="group" aria-labelledby="gm-animal-choices-title"></div>
        </section>
      </div>
      <article id="gm-animal-card" aria-labelledby="gm-animal-name"></article>
    </div>
    <noscript><p class="gm-notice">请启用 JavaScript 查看植物地图和照片。</p></noscript>
  </main>
</body>
</html>
