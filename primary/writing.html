<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="乐学堂 · 作文坊：四年级写作锦囊、好词好句、带点评的范文、素材百宝箱和可以动笔的作文本。">
  <title>作文坊 · 乐学堂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✏️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="words.css">
  <link rel="stylesheet" href="writing.css">
</head>
<body>
  <a class="skip-link" href="#cards">跳到学习内容</a>
  <div id="app">
    <header>
      <button class="logo" data-act="home">✏️ 作文坊</button>
      <span class="stats-pill" id="stats"></span>
      <span class="spacer"></span>
      <nav class="header-links" aria-label="学习导航">
        <a class="back-btn" href="words.html">📘 单词本</a>
        <a class="back-btn" href="idioms.html">🏮 成语本</a>
        <a class="back-btn" href="index.html">← 乐学堂</a>
      </nav>
    </header>

    <div class="study-shell">
      <aside class="sidebar">
        <p class="sidebar-label">写作分类 <span class="nav-count"></span></p>
        <details class="category-nav" open>
          <summary>切换分类 <span class="nav-current"></span></summary>
          <nav id="chips" aria-label="分类切换"></nav>
        </details>
        <p class="sidebar-note">先看锦囊，再动笔写一篇</p>
      </aside>
      <div class="study-content writing-content">
        <section class="toolbar">
          <div class="search-box">
            <span>🔎</span>
            <input id="search" type="search" aria-label="搜索全部写作素材" placeholder="搜索题目、范文、好词好句…" autocomplete="off">
          </div>
          <button class="play-btn" id="lotteryBtn" data-act="lottery">🎲 灵感抽签</button>
          <button class="play-btn draft-btn" data-act="drafts">📓 我的作文本</button>
        </section>

        <main id="cards" tabindex="-1"></main>
      </div>
    </div>
  </div>
  <div id="modal"></div>

  <script src="speech.js"></script>
  <script src="writing-data.js"></script>
  <script src="writing-app.js"></script>
  <script src="layout.js"></script>
</body>
</html>
