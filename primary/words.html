<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="乐学堂 · 单词本：按单元学习英语单词，大示意图、中文注释、音标、拆分记忆与相关词，全部可点读。">
  <title>单词本 · 乐学堂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📘%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="words.css">
</head>
<body>
  <a class="skip-link" href="#cards">跳到学习内容</a>
  <div id="app">
    <header>
      <button class="logo" data-act="home">📘 单词本</button>
      <span class="stats-pill" id="stats"></span>
      <span class="spacer"></span>
      <nav class="header-links" aria-label="学习导航">
        <a class="back-btn" href="idioms.html">🏮 成语本</a>
        <a class="back-btn" href="writing.html">✏️ 作文坊</a>
        <a class="back-btn" href="index.html">← 乐学堂</a>
      </nav>
    </header>

    <div class="study-shell">
      <aside class="sidebar">
        <p class="sidebar-label">学习单元 <span class="nav-count"></span></p>
        <details class="category-nav" open>
          <summary>切换单元 <span class="nav-current"></span></summary>
          <nav id="chips" aria-label="单元切换"></nav>
        </details>
        <p class="sidebar-note">点图听发音，学会后点 ✓ 标记</p>
      </aside>
      <div class="study-content">
        <section class="toolbar">
          <div class="search-box">
            <span>🔎</span>
            <input id="search" type="search" aria-label="搜索全部单元" placeholder="搜索单词、中文或单元名…" autocomplete="off">
          </div>
          <select id="voiceSel" class="voice-sel" title="选择英语发音人"></select>
          <button class="play-btn" id="playBtn" data-act="play">▶️ 连读本单元</button>
        </section>

        <main id="cards" tabindex="-1"></main>
      </div>
    </div>
  </div>

  <script src="speech.js"></script>
  <script src="words-data.js"></script>
  <script src="words-app.js"></script>
  <script src="layout.js"></script>
</body>
</html>
