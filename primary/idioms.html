<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="乐学堂 · 成语本：按主题学习成语，拼音、逐字点读、典故故事、例句与近反义词，全部可点读。">
  <title>成语本 · 乐学堂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏮%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="words.css">
  <link rel="stylesheet" href="idioms.css">
</head>
<body>
  <a class="skip-link" href="#cards">跳到学习内容</a>
  <div id="app">
    <header>
      <button class="logo" data-act="home">🏮 成语本</button>
      <span class="stats-pill" id="stats"></span>
      <span class="spacer"></span>
      <nav class="header-links" aria-label="学习导航">
        <a class="back-btn" href="words.html">📘 单词本</a>

    <div class="study-shell">

          <button class="play-btn" id="playBtn" data-act="play">▶️ 连读本单元</button>

        <main id="cards" tabindex="-1"></main>
