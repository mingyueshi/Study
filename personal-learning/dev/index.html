      <nav aria-label="学习系统导航"><a href="../index.html">学习首页</a><a href="../english/index.html">英文学习</a><a href="../ai/index.html">AI 学习 <small>提示词与工具</small></a><a href="index.html" aria-current="page">开发命令</a><a href="../coding/index.html">语言与框架</a></nav>

    </header>
    <main id="main">
      <section class="dev-intro" aria-labelledby="devTitle">
        <div><h1 id="devTitle">开发命令 <span>速查与自测</span></h1><p>从日常开发到服务排查，查命令、看示例，再动手记一遍。</p></div>
        <div class="dev-stats" id="devStats"></div>
      </section>
      <div class="dev-shell">
        <aside class="dev-sidebar" aria-label="工具目录与进度">
          <p class="side-heading">我的掌握进度 <strong id="progressLabel">0 / 0</strong></p>
          <progress id="devProgress" value="0" max="0" aria-label="开发命令已掌握进度"></progress>
          <nav id="toolNav" class="tool-nav" aria-label="工具目录"></nav>
          <p class="sidebar-help">点命令即可复制；开启「遮住自测」，先看描述猜命令，再点击揭晓。标记只保存在当前浏览器。</p>
          <div class="sidebar-system"><a href="../index.html">学习首页</a><a href="../english/index.html">英文学习</a><a href="../ai/index.html">AI 学习</a></div>
        </aside>
        <div class="dev-workspace">
          <div class="reader-tools" aria-label="查找与自测">
            <label class="command-search"><span aria-hidden="true">⌕</span><input id="commandSearch" type="search" placeholder="搜索命令或问题，如：端口、取消 暂存…" aria-label="搜索开发命令" autocomplete="off"><button id="clearSearch" type="button" data-dev-act="clear-search" aria-label="清空搜索" hidden>×</button><kbd aria-hidden="true">/</kbd></label>
            <button class="quiz-button" type="button" data-dev-act="quiz" id="quizButton" aria-pressed="false">遮住自测</button>
            <button class="resume-button" type="button" data-dev-act="resume" id="resumeButton">开始速查 <span aria-hidden="true">→</span></button>
            <div class="reader-filters">
              <label class="portrait-tool">工具 <select id="toolSelect" aria-label="选择工具"></select></label>
              <label>搜索范围 <select id="searchScope"><option value="all">全部工具</option><option value="current">当前工具</option></select></label>
              <label>掌握状态 <select id="masteryFilter"><option value="all">全部命令</option><option value="unmastered">未掌握</option><option value="mastered">已掌握</option></select></label>
              <span class="search-help">多个关键词用空格分隔</span>
            </div>
          </div>
          <p class="storage-notice" id="storageNotice" role="status" hidden>浏览器暂时无法保存记录，本次会话仍可继续使用。</p>
          <p class="sr-only" id="viewStatus" role="status" aria-live="polite" aria-atomic="true"></p>
          <div id="devContent" tabindex="-1"></div>
          <p id="copyStatus" class="copy-status" role="status" aria-live="polite" hidden></p>
          <noscript><p>请启用 JavaScript，以使用命令速查、自测和掌握标记。顶部导航仍可切换学习方向。</p></noscript>
