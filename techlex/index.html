<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechLex · 计算机英语学习系统：面向开发、运营、运维的术语本，音标/缩写、构词拆解、双语例句与关联术语，全部可点读。">
  <title>TechLex · 计算机英语学习系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⌨️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="tech.css">
</head>
<body>
  <a class="skip-link" href="#cards">跳到学习内容</a>
  <div id="app">
    <header>
      <button class="logo" data-act="home"><span class="logo-t">Tech</span><span class="logo-l">Lex</span></button>
      <span class="logo-sub">计算机英语 · 在工作中学会使用</span>
      <span class="spacer"></span>
      <span class="stats-pill" id="stats"></span>
      <button class="icon-btn" data-act="toggleSound" id="soundBtn" title="声音" aria-label="切换声音">🔊</button>
    </header>

    <div class="study-shell">
      <aside class="sidebar">
        <p class="sidebar-label">学习分类 <span class="nav-count"></span></p>
        <details class="category-nav" open>
          <summary>切换分类 <span class="nav-current"></span></summary>
          <nav id="chips" aria-label="分类切换"></nav>
        </details>
        <div class="sidebar-foot">
          <p>点读术语与例句，点 ✓ 标记掌握</p>
          <a href="../primary/index.html">← 乐学堂 · 小学版</a>
        </div>
      </aside>
      <div class="study-content">
        <section class="toolbar">
          <div class="search-box">
            <span>⌕</span>
            <input id="search" type="search" aria-label="搜索全部术语" placeholder="搜索术语、中文释义或例句…" autocomplete="off">
          </div>
          <button class="play-btn" id="playBtn" data-act="play">▶ 连读本单元</button>
        </section>

        <main id="cards" tabindex="-1"></main>
      </div>
    </div>
    <footer class="foot"><span>TechLex · 进度保存在当前浏览器</span><a href="../primary/index.html">乐学堂 · 小学版 ↗</a></footer>
  </div>

  <script src="speech.js"></script>
  <script src="tech-data.js"></script>
  <script src="tech-app.js"></script>
  <script src="layout.js"></script>
</body>
</html>
