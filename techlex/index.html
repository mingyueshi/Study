<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TechLex 已迁移 · 个人学习</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EL%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../personal-learning/assets/portal.css"></head>
<body class="portal"><main class="portal-shell"><section class="portal-intro" style="padding-top:72px"><p class="eyebrow">TECHLEX</p><h1>正在进入新的学习空间</h1><p class="lead">TechLex 已移入个人学习系统的英文学习目录。</p><p><a class="action-link primary" id="destination" href="../personal-learning/english/techlex/index.html">进入 TechLex <span aria-hidden="true">→</span></a></p></section></main>
<script src="../personal-learning/english/techlex/tech-data.js"></script><script src="../personal-learning/english/techlex/progress.js"></script>
<script>
(function () {
  'use strict';
  const destination = new URL(document.getElementById('destination').getAttribute('href'), window.location.href);
  const progress = window.LearningProgress.read(TECH_UNITS);
  try {
    const pref = JSON.parse(localStorage.getItem('speech_pref_v1') || 'null');
    if (pref && typeof pref.voice === 'string' && pref.voice.length <= 200) progress.speechVoice = pref.voice;
  } catch (e) { /* 使用默认语音 */ }
  if (Object.keys(progress.learned).length || progress.lastUnit || !progress.sound || progress.speechVoice) {
    destination.hash = new URLSearchParams({ 'techlex-migrate': JSON.stringify(progress) }).toString();
  }
  document.getElementById('destination').href = destination.href;
  window.location.replace(destination.href);
})();
</script></body></html>
